# Code Steward Agent - Configuration File
# Change values here, then call POST /config/reload (or restart the API).
# Invalid values are rejected with a message and the previous settings stay in use.
# Settings that are left out use the defaults written in Services/ConfigService.py.

service:
  # Start the background service together with the API
  auto_start: true
  # Seconds between steps of the background loop
  tick_seconds: 5

scanning:
  # Folders to watch. A relative path is a folder inside the program folder, the same on Windows and
  # Mac: put copies of code into code-steward-agent/watched (created at start). Absolute paths and
  # ~ (your home folder) work too. Choose a project's parent folder to keep the whole project together.
  root_paths:
    - watched

  # File extensions to include (leave empty to include everything;
  # empty is needed to find data files, documents and compiled programs)
  # Example: [".py", ".sh", ".bat", ".js", ".ts", ".rb", ".pl"]
  include_extensions: []

  # Folder names to always skip
  exclude_folders:
    - ".git"
    - "__pycache__"
    - "node_modules"
    - "venv"
    - ".venv"
    - "dist"
    - "build"

  # Extra folders that must never be read. System folders such as C:\Windows
  # and C:\Program Files are always protected.
  deny_paths: []

  # Larger files are still listed, but their contents are not hashed (10MB default)
  max_file_size_bytes: 10485760

  # How often the full scan runs (in seconds). The file watcher reports most changes
  # within seconds; this scan catches anything it missed.
  scan_interval_seconds: 300

  # How changes are noticed: auto (system change events, polling if they fail), events or polling
  watch_mode: auto
  # Seconds between checks when polling
  polling_interval_seconds: 30

events:
  # Wait until a file has been quiet this long before checking it
  quiet_seconds: 5
  # ...but never wait longer than this for a file that keeps changing
  max_wait_seconds: 60
  # When more files are waiting than this, run one full scan instead
  max_pending_files: 10000

logging:
  # DEBUG, INFO, WARNING, ERROR or CRITICAL
  level: INFO
  # Start a new service.log at this size and keep this many older files (0 = never)
  max_bytes: 5242880
  backup_count: 3

storage:
  # Relative paths are inside the program folder. database_path changes after a restart.
  database_path: artifacts.sqlite3
  log_path: service.log

testing:
  # Allow POST /events/inject to simulate file changes for validation (keep false in normal use)
  allow_event_injection: false

ai:
  # Explain new and changed code files with a local model through Ollama
  # (Ollama must be installed and open; the model is not downloaded automatically)
  enabled: true
  # A model name from settings_file (qwen-4b, qwen-9b, qwen-coder-7b, qwen-coder-3b) or an installed Ollama tag
  model: qwen-4b
  # cpu (default) or auto (use the GPU when available; answers can differ slightly)
  device: cpu
  # CPU threads for the model: auto (all performance cores, fastest) or a number (lighter on the computer)
  num_thread: auto
  # Model list and limits (context size, answer length, file size); the prompts are in the same folder
  settings_file: ai/settings/default.json
  # File types that get an explanation
  analyze_types: ["script", "wrapper"]
  # Tries per file before it is marked failed (waiting for Ollama does not count)
  max_attempts: 3

organization:
  # Include additional topic copies in the plan automatically.
  suggest_reuse: true
  # Assess additional topic labels in batches using cached file explanations.
  reuse_batch_size: 3
  # Legacy setting (ignored): there is no longer a global one-pair limit.
  reuse_max_pairs: 1
  # Legacy setting (ignored): all code files are considered, including files in large projects.
  reuse_max_groups: 3
  # Organized copies go here: a folder inside the program folder (code-steward-agent/library),
  # the same on Windows and Mac. It must not be inside a watched folder.
  library_path: library
  # Keep the library's version history in a private local Git repository (one commit per run and undo)
  git: true
  # The topic folders for the organization plan (POST /organization/plan): ids, descriptions
  # and keyword hints. Edit this file to use your own topics.
  topics_file: ai/settings/topics.json
